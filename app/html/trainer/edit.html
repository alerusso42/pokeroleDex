<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/html/style.css">
    <title>Editor Allenatore</title>
    <style>
        .edit-container { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        label { font-weight: bold; color: var(--poke-red); text-transform: uppercase; font-size: 0.8em; }
        
        input, select { padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit; }
        
        .pokemon-edit-card {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; padding: 10px 15px; border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 8px;
            border-left: 4px solid var(--poke-red);
        }

        .btn-remove { background: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; }
        
        .add-pokemon-box {
            background: #f0f0f0; padding: 15px; border-radius: 10px; border: 2px dashed #ccc;
            display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;
            position: relative; /* Necessario per il posizionamento assoluto della ricerca */
        }

        .btn-add { background: var(--poke-red); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .btn-save {
            background: #27ae60; color: white; border: none; padding: 15px;
            border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.1em;
            margin: 30px 0; transition: 0.3s;
        }
        .btn-save:hover { background: #219150; transform: translateY(-2px); }
        .section-title { border-bottom: 2px solid var(--poke-red); padding-bottom: 5px; margin-top: 20px; font-weight: bold; }

        /* STILI AGGIUNTI PER L'AUTOCOMPLETAMENTO SOTTO L'INPUT SPECIE */
        .search-species-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #search-results-preview {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #ddd;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #search-results-preview:empty {
            display: none;
        }

        /* Adattamento classi iniettate dal backend per il dropdown */
        #search-results-preview .search-category-title {
            background: #f4f4f4;
            padding: 5px 10px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            color: #666;
        }

        #search-results-preview .search-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            text-decoration: none;
            color: #333;
            gap: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        #search-results-preview .search-item:hover {
            background: #f9f9f9;
        }

        #search-results-preview .item-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        #search-results-preview .item-type-label {
            margin-left: auto;
            font-size: 0.75em;
            background: #ddd;
            padding: 2px 6px;
            border-radius: 4px;
            display: none; /* Nascondiamo la label della categoria dato che siamo già dentro pokedex */
        }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="btn-home">⬅️ ANNULLA</a>

    <div id="test">
        <h1>Modifica Allenatore</h1>
        
        <form id="trainer-form" class="edit-container">
            <div class="section-title">Dati Generali</div>
            <div class="form-group">
                <label>Nome Allenatore</label>
                <input type="text" id="t-name" required>
            </div>

            <div class="form-group">
                <label>Categoria (Sprite)</label>
                <select id="t-category">
                    <option value="team_black">Team Black</option>
                    <option value="ace_trainer">Ace Trainer</option>
                    <option value="beauty">Beauty</option>
                    <option value="hiker">Hiker</option>
                </select>
            </div>

            <div class="section-title">Immagini Allenatore</div>
            <div class="form-group">
                <label>Sprite Allenatore (Img)</label>
                <input type="file" id="upload-img" accept="image/*" onchange="handleUpload(this, 'Img')">
            </div>

            <div class="form-group">
                <label>Icona (Ico)</label>
                <input type="file" id="upload-ico" accept="image/*" onchange="handleUpload(this, 'Ico')">
            </div>

            <div class="section-title">Squadra Pokémon</div>
            <div id="pokemon-list-container">
            </div>

            <div class="section-title">Aggiungi Nuovo Pokémon</div>
            <div class="add-pokemon-box">
                <div class="form-group search-species-wrapper" style="margin:0">
                    <label>Specie</label>
                    <input type="text" id="new-pkmn-species" placeholder="Es: Pikachu" autocomplete="off">
                    <div id="search-results-preview"></div>
                </div>
                <div class="form-group" style="margin:0">
                    <label>Rank</label>
                    <select id="new-pkmn-rank">
                        <option value="Starter">Starter</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Amateur">Amateur</option>
                        <option value="Ace">Ace</option>
                        <option value="Pro">Pro</option>
                        <option value="Master">Master</option>
                    </select>
                </div>
                <button type="button" class="btn-add" onclick="addPokemonToList()">AGGIUNGI</button>
            </div>

            <button type="submit" class="btn-save">SALVA ALLENATORE</button>
        </form>
    </div>

<script>
    let trainerData = null;
    
    // Questo array conterrà gli oggetti per il backend: 
    // { type: "DELETE", id: "..." } oppure { type: "CREATE", pkmn: "...", data: {...} }
    let pendingOperations = [];
    
    // Lista visiva attuale (quella che l'utente vede a schermo)
    let visualPokemonList = [];
    let trainerName;

    async function loadTrainerData() {
        const pathParts = window.location.pathname.split('/');
        trainerName = pathParts[pathParts.length - 1];
        
        const response = await fetch(`/api/trainer/${trainerName}`);
        trainerData = await response.json();

        document.getElementById('t-name').value = trainerData.Name;
        document.getElementById('t-category').value = trainerData.Category;

        // Inizializziamo la lista visiva con i nomi/ID attuali
        visualPokemonList = [...trainerData.Pokemon];
        renderPokemonList();
    }

    function renderPokemonList() {
        const container = document.getElementById('pokemon-list-container');
        container.innerHTML = '';

        visualPokemonList.forEach((pkmnId, index) => {
            container.innerHTML += `
                <div class="pokemon-edit-card">
                    <span><strong>${pkmnId.replace("_", " (ID: ")} )</strong></span>
                    <button type="button" class="btn-remove" onclick="removePokemon(${index})">Rimuovi</button>
                </div>
            `;
        });
    }

    function removePokemon(index) 
    {
        const pkmnId = visualPokemonList[index];

        // Se il Pokémon è nuovo (placeholder "_NEW"), dobbiamo semplicemente 
        // cancellare l'operazione di creazione corrispondente
        if (pkmnId.endsWith("_NEW")) {
            // Troviamo l'indice dell'operazione CREATE basandoci su quante 
            // operazioni di creazione ci sono prima di questa
            let createIndex = -1;
            let count = 0;
            
            // Cerchiamo l'operazione che corrisponde a questo specifico inserimento
            // Per semplicità, cerchiamo l'operazione CREATE che ha lo stesso nome
            const speciesName = pkmnId.split("_NEW")[0];
            
            // Troviamo l'indice reale in pendingOperations
            const opIndex = pendingOperations.findIndex(op => 
                op.type === "CREATE" && op.name === speciesName
            );

            if (opIndex !== -1) {
                pendingOperations.splice(opIndex, 1);
            }
        } else {
            // Se il Pokémon esisteva già sul server, allora serve una DELETE reale
            pendingOperations.push({
                type: "DELETE",
                id: pkmnId,
                reason: "FREED"
            });
        }

        // Rimuoviamo dalla vista in ogni caso
        visualPokemonList.splice(index, 1);
        renderPokemonList();
    }

    function addPokemonToList() {
        const species = document.getElementById('new-pkmn-species').value.trim();
        const rank = document.getElementById('new-pkmn-rank').value;

        if (!species) return alert("Inserisci una specie!");

        // Aggiungiamo l'operazione
        pendingOperations.push({
            type: "CREATE",
            name: species,
            data: { 
                Rank: rank,
                Trainer: document.getElementById('t-name').value 
            }
        });

        // Usiamo il nome della specie + un marker unico per riconoscerlo come "nuovo"
        visualPokemonList.push(`${species}_NEW`);
        
        document.getElementById('new-pkmn-species').value = '';
        renderPokemonList();
    }

    /* ==========================================
       LOGICA SUGGERIMENTI KEYPRESSED (POKÉMON)
       ========================================== */
    const speciesInput = document.getElementById('new-pkmn-species');
    const previewContainer = document.getElementById('search-results-preview');

    async function executeSpeciesTip() {
        const query = speciesInput.value.trim();
        
        if (query.length < 1) {
            previewContainer.innerHTML = '';
            return;
        }

        try {
            // Invio array codificato in query string come richiesto dal tuo backend ["pokedex"]
            const response = await fetch(`/keyPressed/search/${query}?include=%5B%22pokedex%22%5D`);
            const htmlOutput = await response.text();
            previewContainer.innerHTML = htmlOutput;
        } catch (err) {
            console.error("Errore live search:", err);
        }
    }

    // Ascolta la digitazione dell'utente sulla Specie
    speciesInput.addEventListener('input', executeSpeciesTip);

    // Gestione del click sul Pokémon suggerito dal backend
    previewContainer.addEventListener('click', function(e) {
        // Cerca l'ancora <a> più vicina all'elemento cliccato (es. se clicchi l'immagine o lo span)
        const targetAnchor = e.target.closest('.search-item');
        
        if (targetAnchor) {
            e.preventDefault(); // Blocca l'apertura del link del backend
            
            // Estrae il nome del Pokémon dallo span interno (.item-name)
            const pkmnName = targetAnchor.querySelector('.item-name').innerText.trim();
            
            // Assegna il nome all'input e pulisce il dropdown
            speciesInput.value = pkmnName;
            previewContainer.innerHTML = '';
        }
    });

    // Chiude la tendina se l'utente clicca fuori dal box di ricerca
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-species-wrapper')) {
            previewContainer.innerHTML = '';
        }
    });
    /* ========================================== */

    document.getElementById('trainer-form').onsubmit = async (e) => {
        e.preventDefault();

        const payload = {
            name: document.getElementById('t-name').value,
            pkmn: pendingOperations 
        };

        try {
            const response = await fetch(`/api/trainer/${trainerName}`, { // Rotta unica
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            let err = await response.text();
            if (response.ok) {
                window.location.href = `/trainer/${payload.name}`;
            }
            else if (response.status == 500)
            {
                window.location.href = `/html/error/500.html?msg=${encodeURIComponent(err)}`;
            } 
            else {
                alert("Errore durante il salvataggio (" + response.status + ": " + err + ")");
            }
        } catch (err) {
            alert("Errore critico client: " + err);
        }
    };


async function handleUpload(input, filetype) {
    const file = input.files[0];
    if (!file) return;

    // 1. Estrae l'estensione (es. "png", "jpg")
    const ext = file.name.split('.').pop().toLowerCase();
    
    // 2. Prepara l'URL con i parametri richiesti dal tuo backend
    // :type -> req.params.type (es. "trainer")
    // :id -> req.params.id (es. "red")
    // ?ext=... &filetype=... -> req.query
    const type = "trainer"; // Sostituisci con la categoria corretta se dinamica
    const id = trainerName;   // La variabile trainerName è già definita nel tuo script
    
    const url = `/api/upload/${type}/${id}?ext=${ext}&filetype=${filetype}`;

    try {
        // 3. Legge il file come ArrayBuffer (dati binari grezzi)
        const arrayBuffer = await file.arrayBuffer();

        // 4. Invia la fetch con il body binario
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/octet-stream' // Indica dati binari generici
            },
            body: arrayBuffer // Il tuo backend riceverà questo nel client.body
        });

        if (response.ok) {} 
        else {
            const errorMsg = await response.text();
            alert(`Errore caricamento ${filetype}: ${errorMsg}`);
            input.value = ""; // Resetta l'input in caso di errore
        }
    } catch (err) {
        console.error("Errore durante l'upload:", err);
        alert("Errore critico durante l'invio del file.");
    }
}

    loadTrainerData();
</script>
</body>
</html>
