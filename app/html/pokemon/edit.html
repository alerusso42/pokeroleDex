<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/html/style.css">
    <title>Editor Pokémon</title>
    <style>
        .edit-container { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        label { font-weight: bold; color: var(--poke-red); text-transform: uppercase; font-size: 0.8em; }
        input, select, textarea {
            padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit;
        }
        input:focus { border-color: var(--poke-red); outline: none; }
        
        .stats-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            background: #f9f9f9; padding: 15px; border-radius: 10px;
        }
        .stat-input-group { display: flex; align-items: center; gap: 10px; }
        .stat-input-group input { width: 60px; text-align: center; }

        .move-card {
            border-left: 5px solid var(--poke-red);
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
        }

        .btn-save {
            background: #27ae60; color: white; border: none; padding: 15px;
            border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.1em;
            transition: 0.3s; margin: 40px 0;
        }
        .btn-save:hover { background: #219150; transform: translateY(-2px); }
        .section-title { border-bottom: 2px solid var(--poke-red); padding-bottom: 5px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="btn-home">⬅️ ANNULLA</a>

    <div id="test">
        <h1 id="edit-title">Modifica Pokémon</h1>
        
        <form id="pokemon-form" class="edit-container">
            <div class="section-title">Dati Base</div>
            <div class="form-group">
                <label>Nome Soprannome</label>
                <input type="text" id="f-name" required>
            </div>
            
            <div class="stats-grid">
                <div class="form-group" style="position: relative;">
                    <label>Specie</label>
                    <input type="text" id="f-species" autocomplete="off" placeholder="Cerca una specie..." required>
                    <div id="species-autocomplete-container" style="position: absolute; width: 100%; top: 100%; left: 0; z-index: 1000; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15);"></div>
                </div>
                <div class="form-group">
                    <label>HP (Attuali / Max Specie)</label>
                    <div class="stat-input-group">
                        <input type="number" id="f-hp-curr"> <span>/</span> <input type="text" id="f-hp-max" readonly style="background: #eee; border: none;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Will (Attuali / Max)</label>
                    <div class="stat-input-group">
                        <input type="number" id="f-will-curr"> <span>/</span> <input type="number" id="f-will-max">
                    </div>
                </div>
            </div>

            <div class="section-title">Attributi (Attuale / Max Pokedex)</div>
            <div class="stats-grid" id="attributes-container"></div>

            <div class="section-title">Skills (Valore Attuale)</div>
            <div class="stats-grid" id="skills-container"></div>

            <div class="section-title">Abilità</div>
            <div class="form-group">
                <label>Nome Abilità</label>
                <input type="text" id="f-abil-name">
                <label>Effetto</label>
                <textarea id="f-abil-effect" rows="3"></textarea>
            </div>

            <div class="section-title">Mosse</div>
            <div id="moves-container"></div>

            <button type="submit" class="btn-save">SALVA TUTTE LE MODIFICHE</button>
        </form>
    </div>

    <script>
        const attrNames = ["Strength", "Dexterity", "Vitality", "Special", "Insight"];
        const skillNames = ["Brawl", "Channel", "Clash", "Evasion", "Alert", "Athletics", "Nature", "Stealth", "Initiative"];
        let originalData = null;
        let currentSpeciesData = null; // Contiene l'oggetto Pokedex locale del pokemon attuale

        // Inizializzazione UI statica
        const attrContainer = document.getElementById('attributes-container');
        attrNames.forEach(attr => {
            attrContainer.innerHTML += `
                <div class="form-group">
                    <label>${attr}</label>
                    <div class="stat-input-group">
                        <input type="number" id="curr-${attr}"> <span>/</span> <input type="text" id="max-${attr}" readonly style="background:#eee; border:none; width:60px; text-align:center;">
                    </div>
                </div>`;
        });

        const skillContainer = document.getElementById('skills-container');
        skillNames.forEach(skill => {
            skillContainer.innerHTML += `
                <div class="form-group">
                    <label>${skill}</label>
                    <input type="number" id="skill-${skill}">
                </div>`;
        });

        // =========================================================================
        // LOGICA DI AGGIORNAMENTO DATI SPECIE (MAX ATTRIBUTI / SKILLS / HP)
        // =========================================================================
        
        // Cerca i dati del pokemon sul server e aggiorna i tetti massimi della scheda
        async function updateSpeciesMaxData(speciesName) {
            if (!speciesName) {
                clearMaxFields();
                return;
            }

            try {
                const response = await fetch(`/keyPressed/autoindex/pokedex/${encodeURIComponent(speciesName)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conds: [] })
                });

                if (response.ok) {
                    const match = await response.json();
                    // Controlliamo se c'è un match valido nell'array e prendiamo il primo elemento
                    if (match && match.length > 0) {
                        currentSpeciesData = match[0];
                        applyMaxValues(currentSpeciesData);
                        return;
                    }
                }
                clearMaxFields();
            } catch (error) {
                console.error("Errore nel recupero dei limiti di specie:", error);
                clearMaxFields();
            }
        }

        // Applica i valori massimi presi dall'oggetto del pokedex recuperato
        function applyMaxValues(data) {
            // HP di base della specie
            document.getElementById('f-hp-max').value = data.BaseHP !== undefined ? data.BaseHP : "???";

            // Sincronizza i massimi degli attributi usando la chiave "Max" + NomeAttributo (es: MaxStrength)
            attrNames.forEach(attr => {
                const maxKey = "Max" + attr;
                const maxField = document.getElementById(`max-${attr}`);
                if (maxField) {
                    maxField.value = data[maxKey] !== undefined ? data[maxKey] : "???";
                }
            });
        }

        // Se l'indice è vuoto o fallisce, riempie i campi di "???"
        function clearMaxFields() {
            currentSpeciesData = null;
            document.getElementById('f-hp-max').value = "???";
            attrNames.forEach(attr => {
                const maxField = document.getElementById(`max-${attr}`);
                if (maxField) maxField.value = "???";
            });
        }

        // =========================================================================
        // LOGICA LIVE SEARCH PER IL CAMPO SPECIE
        // =========================================================================
        const speciesInput = document.getElementById('f-species');
        const speciesContainer = document.getElementById('species-autocomplete-container');

        function pokemonToSnakeCase(name) {
            return name.toLowerCase()
                       .replace(/[^a-z0-9\s-]/g, '')
                       .trim()
                       .replace(/\s+/g, '-');
        }

        speciesInput.addEventListener('input', async function() {
            const keyPressed = this.value.trim();

            if (!keyPressed) {
                speciesContainer.innerHTML = '';
                clearMaxFields();
                return;
            }

            try {
                const response = await fetch(`/keyPressed/autoindex/pokedex/${encodeURIComponent(keyPressed)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conds: [] })
                });

                if (!response.ok) throw new Error("Errore nel recupero delle specie");

                const match = await response.json();
                renderSpeciesResults(match);

                // Se l'utente digita esattamente il nome di un pokemon valido della lista, aggiorna i massimi al volo
                if (match && match.length > 0 && match[0].Name.toLowerCase() === keyPressed.toLowerCase()) {
                    currentSpeciesData = match[0];
                    applyMaxValues(currentSpeciesData);
                } else if (!match || match.length === 0) {
                    clearMaxFields();
                }

            } catch (error) {
                console.error("Errore fetch autoindex:", error);
                speciesContainer.innerHTML = `<div class="search-category-title" style="background: var(--poke-red);">Errore di rete</div>`;
            }
        });

        function renderSpeciesResults(match) {
            speciesContainer.innerHTML = '';
            if (!match || match.length === 0) return;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'search-category-title';
            titleDiv.textContent = 'pokedex';
            speciesContainer.appendChild(titleDiv);

            const listDiv = document.createElement('div');
            listDiv.className = 'search-results-list';

            match.forEach(pokemon => {
                const name = pokemon.Name;
                const imgFile = pokemonToSnakeCase(name) + ".png";
                
                const itemAnchor = document.createElement('a');
                itemAnchor.href = '#';
                itemAnchor.className = 'search-item';
                
                const imgHtml = `<img src="https://raw.githubusercontent.com/Pokerole-Software-Development/Pokerole-Data/master/images/BoxSprites/${imgFile}" class="item-icon" style="width: 32px; height: 32px; margin-right: 8px; object-fit: contain;">`;

                itemAnchor.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        ${imgHtml}
                        <span class="item-name">${name}</span>
                    </div>
                    <span class="item-type-label">pokedex</span>
                `;

                itemAnchor.addEventListener('click', (e) => {
                    e.preventDefault();
                    speciesInput.value = name;
                    speciesContainer.innerHTML = '';
                    
                    // Salviamo l'oggetto pokemon selezionato e aggiorniamo i massimi della UI
                    currentSpeciesData = pokemon;
                    applyMaxValues(currentSpeciesData);
                });

                listDiv.appendChild(itemAnchor);
            });

            speciesContainer.appendChild(listDiv);
        }

        document.addEventListener('click', (e) => {
            if (e.target !== speciesInput && !speciesContainer.contains(e.target)) {
                speciesContainer.innerHTML = '';
            }
        });

        // =========================================================================
        // CARICAMENTO E SALVATAGGIO DATI ORIGINARI
        // =========================================================================
        async function loadData() {
            const pathParts = window.location.pathname.split('/');
            const pkmnId = pathParts[pathParts.length - 1];
            
            const response = await fetch(`/api/pokemon/${pkmnId}`);
            originalData = await response.json();

            // Popola Dati Base
            document.getElementById('f-name').value = originalData.Name;
            document.getElementById('f-species').value = originalData.Species;
            
            // Popola i massimi iniziali mandando la richiesta con la specie corrente caricata
            await updateSpeciesMaxData(originalData.Species);

            // Gestione HP e Will
            document.getElementById('f-hp-curr').value = originalData.HP.current || 0;
            document.getElementById('f-will-curr').value = originalData.Will ? originalData.Will.current : 0;
            document.getElementById('f-will-max').value = originalData.Will ? originalData.Will.max : 0;

            // Popola Attributi Correnti
            attrNames.forEach(attr => {
                document.getElementById(`curr-${attr}`).value = originalData[attr].current;
            });

            // Popola Skills
            skillNames.forEach(skill => {
                document.getElementById(`skill-${skill}`).value = originalData[skill] || 0;
            });

            // Popola Abilità
            document.getElementById('f-abil-name').value = originalData.Ability.Name;
            document.getElementById('f-abil-effect').value = originalData.Ability.Effect;

            // Genera e Popola Mosse
            const movesContainer = document.getElementById('moves-container');
            movesContainer.innerHTML = '';
            originalData.Moves.forEach((move, i) => {
                movesContainer.innerHTML += `
                    <div class="move-card">
                        <div class="stats-grid">
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Nome Mossa ${i+1}</label>
                                <input type="text" id="move-name-${i}" value="${move.Name}">
                            </div>
                            <div class="form-group">
                                <label>Tipo</label>
                                <input type="text" id="move-type-${i}" value="${move.Type}">
                            </div>
                            <div class="form-group">
                                <label>Potenza</label>
                                <input type="number" id="move-power-${i}" value="${move.Power}">
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Effetto</label>
                                <textarea id="move-effect-${i}" rows="2">${move.Effect}</textarea>
                            </div>
                        </div>
                    </div>`;
            });
        }

        document.getElementById('pokemon-form').onsubmit = async (e) => {
            e.preventDefault();
            const updatedData = { ...originalData };
            
            // Sync Base
            updatedData.Name = document.getElementById('f-name').value;
            updatedData.Species = document.getElementById('f-species').value;
            
            // Salviamo l'HP calcolato / o quello presente
            updatedData.HP = {
                current: parseInt(document.getElementById('f-hp-curr').value),
                max: parseInt(document.getElementById('f-hp-max').value) || originalData.HP.max
            };
            updatedData.Will = {
                current: parseInt(document.getElementById('f-will-curr').value),
                max: parseInt(document.getElementById('f-will-max').value)
            };

            // Sync Attributi
            attrNames.forEach(attr => {
                updatedData[attr] = {
                    current: parseInt(document.getElementById(`curr-${attr}`).value),
                    max: parseInt(document.getElementById(`max-${attr}`).value) || originalData[attr].max
                };
            });

            // Sync Skills
            skillNames.forEach(skill => {
                updatedData[skill] = parseInt(document.getElementById(`skill-${skill}`).value);
            });

            // Sync Abilità
            updatedData.Ability.Name = document.getElementById('f-abil-name').value;
            updatedData.Ability.Effect = document.getElementById('f-abil-effect').value;

            // Sync Mosse
            updatedData.Moves = originalData.Moves.map((move, i) => ({
                ...move,
                Name: document.getElementById(`move-name-${i}`).value,
                Type: document.getElementById(`move-type-${i}`).value,
                Power: parseInt(document.getElementById(`move-power-${i}`).value),
                Effect: document.getElementById(`move-effect-${i}`).value
            }));

            const response = await fetch(`/api/pokemon/${originalData.Id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (response.ok) {
                alert("Salvataggio completato!");
                window.location.href = `/pokemon/${updatedData.Id}`;
            } else {
                alert("Errore durante il salvataggio.");
            }
        };

        loadData();
    </script>
</body>
</html>
