<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/html/style.css">
    <title>Editor Pokémon</title>
    <style>
        .edit-container { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        label { font-weight: bold; color: var(--poke-red); text-transform: uppercase; font-size: 0.8em; }
        input, select, textarea {
            padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit;
        }
        input:focus { border-color: var(--poke-red); outline: none; }
        
        .stats-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            background: #f9f9f9; padding: 15px; border-radius: 10px;
        }
        .stat-input-group { display: flex; align-items: center; gap: 10px; }
        .stat-input-group input { width: 60px; text-align: center; }

        .move-card {
            border-left: 5px solid var(--poke-red);
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .move-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            background: #f1f1f1;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .btn-save {
            background: #27ae60; color: white; border: none; padding: 15px;
            border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.1em;
            transition: 0.3s; margin: 40px 0;
        }
        .btn-save:hover { background: #219150; transform: translateY(-2px); }
        .section-title { border-bottom: 2px solid var(--poke-red); padding-bottom: 5px; margin-top: 20px; font-weight: bold; }
        
        .autocomplete-box {
            position: absolute; width: 100%; top: 100%; left: 0; z-index: 1000; 
            max-height: 250px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: white; border-radius: 0 0 8px 8px;
        }
        
        .item-desc-preview {
            display: block; font-size: 0.75em; color: #666; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }

        .rank-badge {
            font-size: 0.75em;
            background: #e0e0e0;
            color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: auto;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="btn-home">⬅️ ANNULLA</a>

    <div id="test">
        <h1 id="edit-title">Modifica Pokémon</h1>
        
        <form id="pokemon-form" class="edit-container">
            <div class="section-title">Dati Base</div>
            <div class="form-group">
                <label>Nome Soprannome</label>
                <input type="text" id="f-name" required>
            </div>
            
            <div class="stats-grid">
                <div class="form-group" style="position: relative;">
                    <label>Specie</label>
                    <input type="text" id="f-species" autocomplete="off" placeholder="Cerca una specie..." required>
                    <div id="species-autocomplete-container" class="autocomplete-box"></div>
                </div>
                <div class="form-group">
                    <label>HP (Attuali / Max Specie)</label>
                    <div class="stat-input-group">
                        <input type="number" id="f-hp-curr"> <span>/</span> <input type="text" id="f-hp-max" readonly style="background: #eee; border: none;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Will (Attuali / Max)</label>
                    <div class="stat-input-group">
                        <input type="number" id="f-will-curr"> <span>/</span> <input type="number" id="f-will-max">
                    </div>
                </div>
            </div>

            <div class="section-title">Attributi (Attuale / Max Pokedex)</div>
            <div class="stats-grid" id="attributes-container"></div>

            <div class="section-title">Skills (Valore Attuale)</div>
            <div class="stats-grid" id="skills-container"></div>

            <div class="section-title">Abilità</div>
            <div class="form-group" style="position: relative;">
                <label>Nome Abilità</label>
                <input type="text" id="f-abil-name" autocomplete="off" placeholder="Clicca o cerca un'abilità...">
                <div id="ability-autocomplete-container" class="autocomplete-box"></div>
                <label style="margin-top: 10px;">Effetto</label>
                <textarea id="f-abil-effect" rows="3"></textarea>
            </div>

            <div class="section-title">Mosse</div>
            <div id="moves-container"></div>

            <button type="submit" class="btn-save">SALVA TUTTE LE MODIFICHE</button>
        </form>
    </div>

    <script>
        const attrNames = ["Strength", "Dexterity", "Vitality", "Special", "Insight"];
        const skillNames = ["Brawl", "Channel", "Clash", "Evasion", "Alert", "Athletics", "Nature", "Stealth", "Initiative"];
        let originalData = null;
        let currentSpeciesData = null; 

        // Inizializzazione UI statica
        const attrContainer = document.getElementById('attributes-container');
        attrNames.forEach(attr => {
            attrContainer.innerHTML += `
                <div class="form-group">
                    <label>${attr}</label>
                    <div class="stat-input-group">
                        <input type="number" id="curr-${attr}"> <span>/</span> <input type="text" id="max-${attr}" readonly style="background:#eee; border:none; width:60px; text-align:center;">
                    </div>
                </div>`;
        });

        const skillContainer = document.getElementById('skills-container');
        skillNames.forEach(skill => {
            skillContainer.innerHTML += `
                <div class="form-group">
                    <label>${skill}</label>
                    <input type="number" id="skill-${skill}">
                </div>`;
        });

        // =========================================================================
        // LOGICA DI AGGIORNAMENTO DATI SPECIE
        // =========================================================================
        async function updateSpeciesMaxData(speciesName) {
            if (!speciesName) {
                clearMaxFields();
                return;
            }
            try {
                const response = await fetch(`/keyPressed/autoindex/pokedex/${encodeURIComponent(speciesName)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conds: [] })
                });
                if (response.ok) {
                    const match = await response.json();
                    if (match && match.length > 0) {
                        currentSpeciesData = match[0];
                        applyMaxValues(currentSpeciesData);
                        return;
                    }
                }
                clearMaxFields();
            } catch (error) {
                console.error(error);
                clearMaxFields();
            }
        }

        function applyMaxValues(data) {
            document.getElementById('f-hp-max').value = data.BaseHP !== undefined ? data.BaseHP : "???";
            attrNames.forEach(attr => {
                const maxKey = "Max" + attr;
                const maxField = document.getElementById(`max-${attr}`);
                if (maxField) maxField.value = data[maxKey] !== undefined ? data[maxKey] : "???";
            });
        }

        function clearMaxFields() {
            currentSpeciesData = null;
            document.getElementById('f-hp-max').value = "???";
            attrNames.forEach(attr => {
                const maxField = document.getElementById(`max-${attr}`);
                if (maxField) maxField.value = "???";
            });
        }

        // =========================================================================
        // LOGICA LIVE SEARCH PER IL CAMPO SPECIE
        // =========================================================================
        const speciesInput = document.getElementById('f-species');
        const speciesContainer = document.getElementById('species-autocomplete-container');

        function pokemonToSnakeCase(name) {
            return name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
        }

        speciesInput.addEventListener('input', async function() {
            const keyPressed = this.value.trim();
            if (!keyPressed) {
                speciesContainer.innerHTML = '';
                clearMaxFields();
                return;
            }
            try {
                const response = await fetch(`/keyPressed/autoindex/pokedex/${encodeURIComponent(keyPressed)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conds: [] })
                });
                if (!response.ok) throw new Error();
                const match = await response.json();
                renderSpeciesResults(match);

                if (match && match.length > 0 && match[0].Name.toLowerCase() === keyPressed.toLowerCase()) {
                    currentSpeciesData = match[0];
                    applyMaxValues(currentSpeciesData);
                } else if (!match || match.length === 0) {
                    clearMaxFields();
                }
            } catch (error) {
                console.error(error);
            }
        });

        function renderSpeciesResults(match) {
            speciesContainer.innerHTML = '';
            if (!match || match.length === 0) return;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'search-category-title';
            titleDiv.textContent = 'pokedex';
            speciesContainer.appendChild(titleDiv);

            const listDiv = document.createElement('div');
            listDiv.className = 'search-results-list';

            match.forEach(pokemon => {
                const name = pokemon.Name;
                const imgFile = pokemonToSnakeCase(name) + ".png";
                const itemAnchor = document.createElement('a');
                itemAnchor.href = '#';
                itemAnchor.className = 'search-item';
                
                const imgHtml = `<img src="https://raw.githubusercontent.com/Pokerole-Software-Development/Pokerole-Data/master/images/BoxSprites/${imgFile}" class="item-icon" style="width: 32px; height: 32px; margin-right: 8px; object-fit: contain;">`;

                itemAnchor.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        ${imgHtml}
                        <div>
                            <span class="item-name">${name}</span>
                            <span class="item-desc-preview">${pokemon.Type1} ${pokemon.Type2 ? '/ ' + pokemon.Type2 : ''} - ${pokemon.DexCategory}</span>
                        </div>
                    </div>
                `;

                itemAnchor.addEventListener('click', (e) => {
                    e.preventDefault();
                    speciesInput.value = name;
                    speciesContainer.innerHTML = '';
                    currentSpeciesData = pokemon;
                    applyMaxValues(currentSpeciesData);
                });
                listDiv.appendChild(itemAnchor);
            });
            speciesContainer.appendChild(listDiv);
        }

        // =========================================================================
        // LOGICA ABILITÀ
        // =========================================================================
        const abilityInput = document.getElementById('f-abil-name');
        const abilityEffectArea = document.getElementById('f-abil-effect');
        const abilityContainer = document.getElementById('ability-autocomplete-container');

        async function fetchAndUpdateAbilityEffect(abilityName) {
            if (!abilityName) {
                abilityEffectArea.value = "???";
                return;
            }
            try {
                const response = await fetch(`/keyPressed/autoindex/ability/${encodeURIComponent(abilityName)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conds: [] })
                });
                if (response.ok) {
                    const match = await response.json();
                    const exactMatch = match.find(a => a.Name.toLowerCase() === abilityName.toLowerCase());
                    if (exactMatch) {
                        abilityEffectArea.value = exactMatch.Effect || "Nessun effetto descritto.";
                        return;
                    }
                }
                abilityEffectArea.value = "???";
            } catch (error) {
                abilityEffectArea.value = "???";
            }
        }

        async function triggerAbilitySearch(inputValue) {
            const trimmedValue = inputValue.trim();

            if (!trimmedValue) {
                if (!currentSpeciesData) {
                    abilityContainer.innerHTML = '';
                    abilityEffectArea.value = "???";
                    return;
                }
                const localAbilities = [
                    { Name: currentSpeciesData.Ability1, Effect: "Abilità Primaria" },
                    { Name: currentSpeciesData.Ability2, Effect: "Abilità Secondaria" },
                    { Name: currentSpeciesData.HiddenAbility, Effect: "Abilità Nascosta" },
                    { Name: currentSpeciesData.EventAbilities, Effect: "Abilità Speciale/Evento" }
                ].filter(a => a.Name && a.Name.trim() !== "");

                renderAbilityResults(localAbilities);
                return;
            }

            try {
                const response = await fetch(`/keyPressed/autoindex/ability/${encodeURIComponent(trimmedValue)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conds: [] })
                });

                if (!response.ok) return;
                const match = await response.json();

                let allowedAbilities = [];
                if (currentSpeciesData) {
                    allowedAbilities = [
                        currentSpeciesData.Ability1, currentSpeciesData.Ability2,
                        currentSpeciesData.HiddenAbility, currentSpeciesData.EventAbilities
                    ].filter(name => name && name.trim() !== "").map(name => name.toLowerCase());
                }

                const filteredMatch = match.filter(ability => {
                    return allowedAbilities.length === 0 || allowedAbilities.includes(ability.Name.toLowerCase());
                });

                renderAbilityResults(filteredMatch);

                const preciseMatch = filteredMatch.find(a => a.Name.toLowerCase() === trimmedValue.toLowerCase());
                if (preciseMatch) abilityEffectArea.value = preciseMatch.Effect;
                else abilityEffectArea.value = "???";

            } catch (error) {
                console.error(error);
            }
        }

        abilityInput.addEventListener('focus', function() { triggerAbilitySearch(this.value); });
        abilityInput.addEventListener('input', function() { triggerAbilitySearch(this.value); });

        function renderAbilityResults(abilities) {
            abilityContainer.innerHTML = '';
            if (!abilities || abilities.length === 0) return;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'search-category-title';
            titleDiv.textContent = 'Abilità Compatibili';
            abilityContainer.appendChild(titleDiv);

            const listDiv = document.createElement('div');
            listDiv.className = 'search-results-list';

            abilities.forEach(ability => {
                const itemAnchor = document.createElement('a');
                itemAnchor.href = '#';
                itemAnchor.className = 'search-item';
                itemAnchor.innerHTML = `
                    <div>
                        <span class="item-name">${ability.Name}</span>
                        <span class="item-desc-preview">${ability.Effect || 'Nessuna descrizione.'}</span>
                    </div>
                `;

                itemAnchor.addEventListener('click', (e) => {
                    e.preventDefault();
                    abilityInput.value = ability.Name;
                    fetchAndUpdateAbilityEffect(ability.Name); 
                    abilityContainer.innerHTML = '';
                });
                listDiv.appendChild(itemAnchor);
            });
            abilityContainer.appendChild(listDiv);
        }

        // =========================================================================
        // LOGICA MOSSE (DIRETTA, ORDINATA PER RANK E AGGIORNAMENTO DIZIONARIO ESTESO)
        // =========================================================================
        async function triggerMoveSearch(index, inputValue) {
            const trimmedValue = inputValue.trim();
            const mContainer = document.getElementById(`move-autocomplete-${index}`);
            const pokemonName = document.getElementById('f-species').value.trim();
            
            const dbRankOrder = ["Starter", "Beginner", "Amateur", "Ace", "Pro", "Master"];

            if (!trimmedValue) {
                if (!pokemonName) {
                    mContainer.innerHTML = '';
                    return;
                }

                try {
                    const response = await fetch(`/keyPressed/data/pokedex/${encodeURIComponent(pokemonName)}/Moves`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ conds: [] })
                    });

                    if (!response.ok) return;
                    let speciesMoves = await response.json();

                    speciesMoves.sort((a, b) => {
                        let indexA = dbRankOrder.indexOf(a.Learned);
                        let indexB = dbRankOrder.indexOf(b.Learned);
                        if (indexA === -1) indexA = 99;
                        if (indexB === -1) indexB = 99;
                        return indexA - indexB;
                    });

                    renderFetchedMoveList(index, speciesMoves, "Mosse della Specie (per Rank)", true);
                } catch (error) {
                    console.error("Errore fetch mosse:", error);
                }
                return;
            }

            try {
                const response = await fetch(`/keyPressed/autoindex/move/${encodeURIComponent(trimmedValue)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conds: [] })
                });

                if (!response.ok) return;
                const match = await response.json();
                renderFetchedMoveList(index, match, "Risultati Ricerca Globale", false);
            } catch (error) {
                console.error(error);
            }
        }

        function renderFetchedMoveList(index, movesList, titleText, isFromSpeciesEmptyInput) {
            const mContainer = document.getElementById(`move-autocomplete-${index}`);
            mContainer.innerHTML = '';
            if (!movesList || movesList.length === 0) return;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'search-category-title';
            titleDiv.textContent = titleText;
            mContainer.appendChild(titleDiv);

            const listDiv = document.createElement('div');
            listDiv.className = 'search-results-list';

            movesList.forEach(move => {
                const itemAnchor = document.createElement('a');
                itemAnchor.href = '#';
                itemAnchor.className = 'search-item';
                itemAnchor.style.display = 'flex';
                itemAnchor.style.justifyContent = 'space-between';
                itemAnchor.style.alignItems = 'center';
                
                const moveName = move.Name;
                const moveType = move.Type || "Generico";
                const movePower = move.Power !== undefined ? move.Power : 0;
                const moveEffect = move.Effect || "Clicca per caricare i dati della mossa";

                const rankBadgeHtml = move.Learned ? `<span class="rank-badge">${move.Learned}</span>` : '';

                itemAnchor.innerHTML = `
                    <div style="flex-grow: 1; min-width: 0;">
                        <span class="item-name">${moveName}</span>
                        <span class="item-desc-preview">Tipo: ${moveType} | Potenza: ${movePower} | ${moveEffect}</span>
                    </div>
                    ${rankBadgeHtml}
                `;

                itemAnchor.addEventListener('click', async (e) => {
                    e.preventDefault();
                    
                    let finalMoveData = move;

                    if (isFromSpeciesEmptyInput) {
                        try {
                            const res = await fetch(`/keyPressed/autoindex/move/${encodeURIComponent(moveName)}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ conds: [] })
                            });
                            if (res.ok) {
                                const globalMatches = await res.json();
                                const exactMatch = globalMatches.find(m => m.Name.toLowerCase() === moveName.toLowerCase());
                                if (exactMatch) {
                                    finalMoveData = exactMatch;
                                }
                            }
                        } catch (err) {
                            console.error("Errore nel recupero dettagli mossa:", err);
                        }
                    }

                    // Inserimento dati standard
                    document.getElementById(`move-name-${index}`).value = finalMoveData.Name || '';
                    document.getElementById(`move-type-${index}`).value = finalMoveData.Type || '';
                    document.getElementById(`move-power-${index}`).value = finalMoveData.Power !== undefined ? finalMoveData.Power : 0;
                    document.getElementById(`move-effect-${index}`).value = finalMoveData.Effect || '';
                    
                    // Inserimento campi del template esteso Pokerole
                    document.getElementById(`move-damage1-${index}`).value = finalMoveData.Damage1 || '';
                    document.getElementById(`move-damage2-${index}`).value = finalMoveData.Damage2 || '';
                    document.getElementById(`move-accuracy1-${index}`).value = finalMoveData.Accuracy1 || '';
                    document.getElementById(`move-accuracy2-${index}`).value = finalMoveData.Accuracy2 || '';
                    document.getElementById(`move-target-${index}`).value = finalMoveData.Target || '';
                    
                    mContainer.innerHTML = '';
                });
                listDiv.appendChild(itemAnchor);
            });
            mContainer.appendChild(listDiv);
        }

        document.addEventListener('click', (e) => {
            if (e.target !== speciesInput && !speciesContainer.contains(e.target)) speciesContainer.innerHTML = '';
            if (e.target !== abilityInput && !abilityContainer.contains(e.target)) abilityContainer.innerHTML = '';
            
            if (originalData && originalData.Moves) {
                originalData.Moves.forEach((_, i) => {
                    const mInput = document.getElementById(`move-name-${i}`);
                    const mBox = document.getElementById(`move-autocomplete-${i}`);
                    if (mInput && mBox && e.target !== mInput && !mBox.contains(e.target)) {
                        mBox.innerHTML = '';
                    }
                });
            }
        });

        // =========================================================================
        // CARICAMENTO E SALVATAGGIO CON ESTENSIONE DETTAGLI TEMPLATE
        // =========================================================================
        async function loadData() {
            const pathParts = window.location.pathname.split('/');
            const pkmnId = pathParts[pathParts.length - 1];
            
            const response = await fetch(`/api/pokemon/${pkmnId}`);
            originalData = await response.json();

            document.getElementById('f-name').value = originalData.Name;
            document.getElementById('f-species').value = originalData.Species;
            
            await updateSpeciesMaxData(originalData.Species);

            document.getElementById('f-hp-curr').value = originalData.HP.current || 0;
            document.getElementById('f-will-curr').value = originalData.Will ? originalData.Will.current : 0;
            document.getElementById('f-will-max').value = originalData.Will ? originalData.Will.max : 0;

            attrNames.forEach(attr => {
                document.getElementById(`curr-${attr}`).value = originalData[attr].current;
            });

            skillNames.forEach(skill => {
                document.getElementById(`skill-${skill}`).value = originalData[skill] || 0;
            });

            if (originalData.Ability && originalData.Ability.Name) {
                document.getElementById('f-abil-name').value = originalData.Ability.Name;
                await fetchAndUpdateAbilityEffect(originalData.Ability.Name);
            } else {
                document.getElementById('f-abil-name').value = "";
                abilityEffectArea.value = "???";
            }

            const movesContainer = document.getElementById('moves-container');
            movesContainer.innerHTML = '';
            originalData.Moves.forEach((move, i) => {
                movesContainer.innerHTML += `
                    <div class="move-card">
                        <div class="stats-grid">
                            <div class="form-group" style="grid-column: span 2; position: relative;">
                                <label>Nome Mossa ${i+1}</label>
                                <input type="text" id="move-name-${i}" autocomplete="off" value="${move.Name || ''}" placeholder="Clicca o cerca una mossa...">
                                <div id="move-autocomplete-${i}" class="autocomplete-box"></div>
                            </div>
                            <div class="form-group">
                                <label>Tipo</label>
                                <input type="text" id="move-type-${i}" value="${move.Type || ''}">
                            </div>
                            <div class="form-group">
                                <label>Potenza</label>
                                <input type="number" id="move-power-${i}" value="${move.Power !== undefined ? move.Power : 0}">
                            </div>
                            
                            <div class="form-group" style="grid-column: span 2;">
                                <div class="move-details-grid">
                                    <div class="form-group">
                                        <label>Bersaglio (Target)</label>
                                        <input type="text" id="move-target-${i}" value="${move.Target || ''}" placeholder="es. Foe, Self">
                                    </div>
                                    <div class="form-group">
                                        <label>Prec. 1 (Accuracy1)</label>
                                        <input type="text" id="move-accuracy1-${i}" value="${move.Accuracy1 || ''}" placeholder="es. Dexterity">
                                    </div>
                                    <div class="form-group">
                                        <label>Prec. 2 (Accuracy2)</label>
                                        <input type="text" id="move-accuracy2-${i}" value="${move.Accuracy2 || ''}" placeholder="es. Channel">
                                    </div>
                                    <div class="form-group">
                                        <label>Danno 1 (Damage1)</label>
                                        <input type="text" id="move-damage1-${i}" value="${move.Damage1 || ''}" placeholder="es. Special">
                                    </div>
                                    <div class="form-group">
                                        <label>Danno 2 (Damage2)</label>
                                        <input type="text" id="move-damage2-${i}" value="${move.Damage2 || ''}">
                                    </div>
                                </div>
                            </div>

                            <div class="form-group" style="grid-column: span 2;">
                                <label>Effetto</label>
                                <textarea id="move-effect-${i}" rows="2">${move.Effect || ''}</textarea>
                            </div>
                        </div>
                    </div>`;
            });

            originalData.Moves.forEach((_, i) => {
                const mInput = document.getElementById(`move-name-${i}`);
                mInput.addEventListener('focus', function() { triggerMoveSearch(i, this.value); });
                mInput.addEventListener('input', function() { triggerMoveSearch(i, this.value); });
            });
        }

        document.getElementById('pokemon-form').onsubmit = async (e) => {
            e.preventDefault();
            const updatedData = { ...originalData };
            
            updatedData.Name = document.getElementById('f-name').value;
            updatedData.Species = document.getElementById('f-species').value;
            
            updatedData.HP = {
                current: parseInt(document.getElementById('f-hp-curr').value),
                max: parseInt(document.getElementById('f-hp-max').value) || originalData.HP.max
            };
            updatedData.Will = {
                current: parseInt(document.getElementById('f-will-curr').value),
                max: parseInt(document.getElementById('f-will-max').value)
            };

            attrNames.forEach(attr => {
                updatedData[attr] = {
                    current: parseInt(document.getElementById(`curr-${attr}`).value),
                    max: parseInt(document.getElementById(`max-${attr}`).value) || originalData[attr].max
                };
            });

            skillNames.forEach(skill => {
                updatedData[skill] = parseInt(document.getElementById(`skill-${skill}`).value);
            });

            updatedData.Ability.Name = document.getElementById('f-abil-name').value;
            updatedData.Ability.Effect = document.getElementById('f-abil-effect').value;

            // Mapping completo e pulito di tutte le proprietà del template move
            updatedData.Moves = originalData.Moves.map((move, i) => ({
                ...move,
                Name: document.getElementById(`move-name-${i}`).value,
                Type: document.getElementById(`move-type-${i}`).value,
                Power: parseInt(document.getElementById(`move-power-${i}`).value) || 0,
                Target: document.getElementById(`move-target-${i}`).value,
                Accuracy1: document.getElementById(`move-accuracy1-${i}`).value,
                Accuracy2: document.getElementById(`move-accuracy2-${i}`).value,
                Damage1: document.getElementById(`move-damage1-${i}`).value,
                Damage2: document.getElementById(`move-damage2-${i}`).value,
                Effect: document.getElementById(`move-effect-${i}`).value
            }));

            const response = await fetch(`/api/pokemon/${originalData.Id}?onlySome=true`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (response.ok) {
                alert("Salvataggio completato!");
                window.location.href = `/pokemon/${updatedData.Id}`;
            } else {
                alert("Errore durante il salvataggio.");
            }
        };

        loadData();
    </script>
</body>
</html>
