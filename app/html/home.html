<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/html/style.css">
    <title>pokeRoleDex - Home</title>
    <style>
        /* Allineamento corpo per centrare il blocco principale */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container principale che eredita lo stile delle tue altre pagine */
        #test {
            margin-top: 60px; /* Spazio ridotto per abbassare la ball */
            width: 100%;
            max-width: 650px;
            padding-top: 130px; /* Spazio interno per non sovrapporsi alla ball */
        }

        /* 1. Pokéball più bassa e integrata */
        .home-ball {
            top: -125px; /* Spostata più in basso (metà ball dentro il container) */
            cursor: pointer;
            width: 220px;
            height: 220px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .home-ball:hover {
            transform: translateX(-50%) scale(1.05) rotate(5deg);
        }

        #random-pkmn-img {
            width: 130%; 
            max-height: 130%;
            z-index: 10;
        }

        /* 2. Navigazione a Icone Giganti */
        .icon-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .nav-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
            border-radius: 20px;
            transition: all 0.2s ease;
            border: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--poke-light);
            border-color: var(--poke-dark);
            transform: translateY(-5px);
        }

        .circle-icon {
            width: 100px;
            height: 100px;
            background: var(--poke-dark);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            border: 5px solid #000;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .nav-item:hover .circle-icon {
            background: var(--poke-red);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.3);
        }

        .nav-label {
            font-size: 1em;
            font-weight: 900;
            color: var(--poke-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 3. Footer/Auth compatto in basso */
        .footer-actions {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

    </style>
</head>
<body>

    <div id="test">
        
        <div class="image-wrapper home-ball" onclick="spawnRandomPkmn()">
            <img id="random-pkmn-img" src="" alt="Pokemon">
        </div>

        <h1>PokeRole Dashboard</h1>

        <div class="icon-nav">
            <a href="/html/search.html" class="nav-item">
                <div class="circle-icon">🔍</div>
                <span class="nav-label">Cerca</span>
            </a>

			<a href="/user/" class="nav-item">
                <div class="circle-icon">👤</div>
                <span class="nav-label">Utenti</span>
            </a>

            <a href="/trainer/" class="nav-item">
                <div class="circle-icon">🎒</div>
                <span class="nav-label">Trainer</span>
            </a>

            <a href="/pokemon/" class="nav-item">
                <div class="circle-icon">⚔️</div>
                <span class="nav-label">Pokémon</span>
            </a>

        </div>

        <div class="footer-actions">
            <a href="/auth" class="badge">Accedi / Cambia Utente</a>
            <a class="badge" onclick="searchPokemonByid()" style="background: #777">Who's that pokemon?</a>
        </div>
    </div>

    <script>
		let json;

        async function spawnRandomPkmn() 
		{
            // fino alla Gen 9
            id = Math.floor(Math.random() * 1010) + 1;
            const img = document.getElementById('random-pkmn-img');
            
            img.style.opacity = '0';
            img.style.transform = 'scale(0.5) rotate(-20deg)';
            setTimeout(() => {
                img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
                img.onload = () => {
                    img.style.opacity = '1';
                    img.style.transform = 'scale(1) rotate(0deg)';
                };
            }, 50);
			json = null;
			let data = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
			json = await data.json();
			playPkmnAudio();
        }

		function playPkmnAudio()
		{
			let audio = new Audio(json.cries.latest);
			audio.play();
		}

        // Primo spawn all'avvio
        spawnRandomPkmn();

		async function searchPokemonByid()
		{
			if (json == null)
			{
				let data = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
				json = await data.json();
			}
			let pokemonName = json.forms[0].name;
			window.location.href = `/search/${pokemonName}`;
		}
    </script>
</body>
</html>
