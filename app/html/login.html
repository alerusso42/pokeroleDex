<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/html/style.css">
    <title>Pokérole Dex - Login</title>
</head>
<body>

    <a href="/" class="btn-home">🏠 HOME</a>

    <div id="test">
        <div class="image-wrapper">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" 
                 style="width: 60%;" alt="Ball">
        </div>

        <h1>Trainer Access</h1>

       <form id="authForm" class="login-form">
    <div class="input-group">
        <label for="username">Nome Utente</label>
        <input type="text" id="username" name="username" placeholder="Es: Giorgio" required>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Opzionale">
    </div>

    <div style="display: flex; gap: 10px;">
        <button type="submit" id="loginBtn" class="btn-login" style="flex: 1;">Accedi</button>
        <button type="submit" id="registerBtn" class="btn-login" style="flex: 1; background: #555;">Registrati</button>
    </div>
</form>

<script>
    const form = document.getElementById('authForm');
    
    // Variabile per capire quale bottone è stato cliccato
    let actionType = 'login';

    document.getElementById('loginBtn').onclick = () => actionType = 'login';
    document.getElementById('registerBtn').onclick = () => actionType = 'register';

    form.onsubmit = async (e) => {
        e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        try {
            const response = await fetch(`/${actionType}/${user}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({password: pass})
            });

            if (response.redirected) {
                window.location.href = response.url;
            } else {
                const text = await response.text();
                alert(text); 
            }
        } catch (err) {
            console.error("Errore autenticazione:", err);
        }
    };
</script>
</body>
</html>
