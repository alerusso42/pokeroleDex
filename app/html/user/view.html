<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon">
    <link rel="stylesheet" href="/html/style.css">
    <title>Profilo Utente</title>
    <style>
        /* Icona matita per l'editing */
        .edit-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            transition: transform 0.2s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .edit-icon:hover {
            transform: scale(1.2) rotate(-10deg);
        }
    </style>
</head>
<body>

    <a href="/" class="btn-home">🏠 HOME</a>

    <div id="test">
        <div class="image-wrapper">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/trainers/1.png" id="data-img" alt="User Avatar">
        </div>

        <img src="https://cdn-icons-png.flaticon.com/512/1159/1159633.png" 
             class="edit-icon" 
             onclick="requestEdit()" 
             title="Modifica Profilo">

        <h1 id="title">Caricamento...</h1>
        
        <div id="content-anchor">
            </div>
    </div>

    <script>
        // Funzione scalabile per caricare i dati (User, Trainer o Pokemon)
        async function loadProfile() {
            try {
                // Supponiamo che l'URL sia /user/NomeUtente
                const pathParts = window.location.pathname.split('/');
                const userName = pathParts[pathParts.length - 1];

                const response = await fetch(`/api/user/${userName}`);
                const data = await response.json();

                // 1. Titolo e Immagine
                document.getElementById('title').innerText = data.Name;
                if(data.Img) document.getElementById('data-img').src = data.Img;

                // 2. Costruzione dinamica delle informazioni (Scalabile)
                let html = `
                    <div class="section-title">Informazioni User</div>
                    <div class="data-row">
                        <span class="key">Ruolo:</span>
                        <span class="value">${data.IsAdmin ? '<span class="badge" style="background:var(--poke-red)">Admin</span>' : 'Utente'}</span>
                    </div>
                    <div class="data-row">
                        <span class="key">User ID:</span>
                        <span class="value">#${data.Id}</span>
                    </div>

                    <div class="section-title">I Tuoi Allenatori</div>
                    <div class="trainer-list">
                `;

                // 3. Lista Allenatori
                if (data.Trainers && data.Trainers.length > 0) {
                    data.Trainers.forEach(t => {
                        html += `
                            <a href="/trainer/${t}" class="trainer-item" style="text-decoration:none">
                                <img src="https://play.pokemonshowdown.com/sprites/trainers/lucas-gen4pt.png" class="trainer-icon">
                                <span class="trainer-name">${t}</span>
                            </a>
                        `;
                    });
                } else {
                    html += `<p style="padding:10px; color:#888;">Nessun allenatore creato.</p>`;
                }

                html += `</div>`;
                document.getElementById('content-anchor').innerHTML = html;

            } catch (err) {
                console.error("Errore nel caricamento:", err);
            }
        }

        function requestEdit() 
		{
            const pathParts = window.location.pathname.split('/');
            const target = pathParts[pathParts.length - 1];
            window.location.href = `/edit${window.location.pathname}`;
        }

        // Avvio
        loadProfile();
    </script>
</body>
</html>
