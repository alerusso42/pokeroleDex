<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PokéDex API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        #test {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Stile per le righe di dati */
        .data-row {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: flex-start;
        }
        .key {
            font-weight: bold;
            color: #2c3e50;
            min-width: 150px;
            text-transform: capitalize;
        }
        .value {
            color: #555;
        }
        /* Link simili a bottoni */
        a {
            color: #e74c3c;
            text-decoration: none;
            font-weight: 500;
            background: #fdf2f2;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        a:hover {
            background: #e74c3c;
            color: white;
        }
        .separator { color: #ccc; margin: 0 5px; }
    </style>
</head>
<body>
    <div id="test">
        </div>
</body>
</html>
