<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/html/style.css">
    <title>Editor Pokémon Pro</title>
    <style>
        .edit-container { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        label { font-weight: bold; color: var(--poke-red); text-transform: uppercase; font-size: 0.8em; }
        input, select, textarea {
            padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit;
        }
        input:focus { border-color: var(--poke-red); outline: none; }
        
        .stats-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            background: #f9f9f9; padding: 15px; border-radius: 10px;
        }
        .stat-input-group { display: flex; align-items: center; gap: 10px; }
        .stat-input-group input { width: 60px; text-align: center; }

        .move-card {
            border-left: 5px solid var(--poke-red);
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
        }

        .btn-save {
            background: #27ae60; color: white; border: none; padding: 15px;
            border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.1em;
            transition: 0.3s; margin: 40px 0;
        }
        .btn-save:hover { background: #219150; transform: translateY(-2px); }
        .section-title { border-bottom: 2px solid var(--poke-red); padding-bottom: 5px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="btn-home">⬅️ ANNULLA</a>

    <div id="test">
        <h1 id="edit-title">Modifica Pokémon</h1>
        
        <form id="pokemon-form" class="edit-container">
            <div class="section-title">Dati Base</div>
            <div class="form-group">
                <label>Nome Soprannome</label>
                <input type="text" id="f-name" required>
            </div>
            
            <div class="stats-grid">
                <div class="form-group">
                    <label>Specie</label>
                    <input type="text" id="f-species" readonly style="background:#eee;">
                </div>
                <div class="form-group">
                    <label>HP Totali</label>
                    <input type="number" id="f-hp">
                </div>
            </div>

            <div class="section-title">Attributi (Attuale / Max)</div>
            <div class="stats-grid" id="attributes-container"></div>

            <div class="section-title">Skills</div>
            <div class="stats-grid" id="skills-container"></div>

            <div class="section-title">Abilità</div>
            <div class="form-group">
                <label>Nome Abilità</label>
                <input type="text" id="f-abil-name">
                <label>Effetto</label>
                <textarea id="f-abil-effect" rows="3"></textarea>
            </div>

            <div class="section-title">Mosse</div>
            <div id="moves-container"></div>

            <button type="submit" class="btn-save">SALVA TUTTE LE MODIFICHE</button>
        </form>
    </div>

    <script>
        const attrNames = ["Strength", "Dexterity", "Vitality", "Special", "Insight"];
        const skillNames = ["Brawl", "Channel", "Clash", "Evasion", "Alert", "Athletics", "Nature", "Stealth"];
        let originalData = null;

        // Inizializzazione UI statica
        const attrContainer = document.getElementById('attributes-container');
        attrNames.forEach(attr => {
            attrContainer.innerHTML += `
                <div class="form-group">
                    <label>${attr}</label>
                    <div class="stat-input-group">
                        <input type="number" id="curr-${attr}"> <span>/</span> <input type="number" id="max-${attr}">
                    </div>
                </div>`;
        });

        const skillContainer = document.getElementById('skills-container');
        skillNames.forEach(skill => {
            skillContainer.innerHTML += `
                <div class="form-group">
                    <label>${skill}</label>
                    <input type="number" id="skill-${skill}">
                </div>`;
        });

        async function loadData() {
            const pathParts = window.location.pathname.split('/');
            const pkmnId = pathParts[pathParts.length - 1];
            
            const response = await fetch(`/api/pokemon/${pkmnId}`);
            originalData = await response.json();

            // Popola Dati Base
            document.getElementById('f-name').value = originalData.Name;
            document.getElementById('f-species').value = originalData.Species;
            document.getElementById('f-hp').value = originalData.HP;
            
            // Popola Attributi
            attrNames.forEach(attr => {
                document.getElementById(`curr-${attr}`).value = originalData[attr].current;
                document.getElementById(`max-${attr}`).value = originalData[attr].max;
            });

            // Popola Skills
            skillNames.forEach(skill => {
                document.getElementById(`skill-${skill}`).value = originalData[skill] || 0;
            });

            // Popola Abilità
            document.getElementById('f-abil-name').value = originalData.Ability.Name;
            document.getElementById('f-abil-effect').value = originalData.Ability.Effect;

            // Genera e Popola Mosse
            const movesContainer = document.getElementById('moves-container');
            movesContainer.innerHTML = '';
            originalData.Moves.forEach((move, i) => {
                movesContainer.innerHTML += `
                    <div class="move-card">
                        <div class="stats-grid">
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Nome Mossa ${i+1}</label>
                                <input type="text" id="move-name-${i}" value="${move.Name}">
                            </div>
                            <div class="form-group">
                                <label>Tipo</label>
                                <input type="text" id="move-type-${i}" value="${move.Type}">
                            </div>
                            <div class="form-group">
                                <label>Potenza</label>
                                <input type="number" id="move-power-${i}" value="${move.Power}">
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Effetto</label>
                                <textarea id="move-effect-${i}" rows="2">${move.Effect}</textarea>
                            </div>
                        </div>
                    </div>`;
            });
        }

        document.getElementById('pokemon-form').onsubmit = async (e) => {
            e.preventDefault();
            const updatedData = { ...originalData };
            
            // Sync Base
            updatedData.Name = document.getElementById('f-name').value;
            updatedData.HP = parseInt(document.getElementById('f-hp').value);

            // Sync Attributi
            attrNames.forEach(attr => {
                updatedData[attr] = {
                    current: parseInt(document.getElementById(`curr-${attr}`).value),
                    max: parseInt(document.getElementById(`max-${attr}`).value)
                };
            });

            // Sync Skills
            skillNames.forEach(skill => {
                updatedData[skill] = parseInt(document.getElementById(`skill-${skill}`).value);
            });

            // Sync Abilità
            updatedData.Ability.Name = document.getElementById('f-abil-name').value;
            updatedData.Ability.Effect = document.getElementById('f-abil-effect').value;

            // Sync Mosse
            updatedData.Moves = originalData.Moves.map((move, i) => ({
                ...move,
                Name: document.getElementById(`move-name-${i}`).value,
                Type: document.getElementById(`move-type-${i}`).value,
                Power: parseInt(document.getElementById(`move-power-${i}`).value),
                Effect: document.getElementById(`move-effect-${i}`).value
            }));

            const response = await fetch(`/api/pokemon/${originalData.Id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (response.ok) {
                alert("Salvataggio completato!");
                window.location.href = `/pokemon/${updatedData.Id}`;
            } else {
                alert("Errore durante il salvataggio.");
            }
        };

        loadData();
    </script>
</body>
</html>
