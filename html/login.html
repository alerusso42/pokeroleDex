<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokérole Dex - Login</title>
    <style>
        :root {
            --poke-red: #d32f2f;
            --poke-dark: #2c3e50;
            --poke-light: #f5f5f5;
            --white: #ffffff;
            --ball-size: 200px; /* Ridotta un po' per il login */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(
                to bottom,
                var(--poke-red) 0%,
                var(--poke-red) 48%,
                #000 48%,
                #000 52%,
                var(--poke-light) 52%,
                var(--poke-light) 100%
            );
            background-attachment: fixed;
            min-height: 100vh;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn-home {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--poke-dark);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            z-index: 100;
            transition: 0.2s;
        }

        .btn-home:hover {
            background: var(--poke-red);
            transform: scale(1.05);
        }

        #test {
            max-width: 400px;
            width: 90%;
            background: var(--white);
            border-radius: 15px;
            padding: 110px 30px 40px 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .image-wrapper {
            width: var(--ball-size);
            height: var(--ball-size);
            background: linear-gradient(
                var(--poke-red) 45%, 
                #000 45%, 
                #000 55%, 
                var(--white) 55%
            );
            border-radius: 50%;
            border: 10px solid #000;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: calc(var(--ball-size) / -2);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .image-wrapper::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 35px;
            background: var(--white);
            border: 6px solid #000;
            border-radius: 50%;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: var(--poke-dark);
            font-size: 1.8em;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-bottom: 3px solid var(--poke-red);
        }

        /* Stile Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
            color: var(--poke-red);
            text-transform: uppercase;
            font-size: 0.8em;
        }

        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--poke-dark);
        }

        .btn-login {
            background: var(--poke-dark);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: var(--poke-red);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer-note {
            text-align: center;
            font-size: 0.8em;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <a href="/" class="btn-home">HOME</a>

    <div id="test">
        <div class="image-wrapper">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" 
                 style="width: 60%;" alt="Ball">
        </div>

        <h1>Trainer Access</h1>

       <form id="authForm" class="login-form">
    <div class="input-group">
        <label for="username">Nome Utente</label>
        <input type="text" id="username" name="username" placeholder="Es: Giorgio" required>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>

    <div style="display: flex; gap: 10px;">
        <button type="submit" id="loginBtn" class="btn-login" style="flex: 1;">Accedi</button>
        <button type="submit" id="registerBtn" class="btn-login" style="flex: 1; background: #555;">Registrati</button>
    </div>
</form>

<script>
    const form = document.getElementById('authForm');
    
    // Variabile per capire quale bottone è stato cliccato
    let actionType = 'login';

    document.getElementById('loginBtn').onclick = () => actionType = 'login';
    document.getElementById('registerBtn').onclick = () => actionType = 'register';

    form.onsubmit = async (e) => {
        e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        try {
            // Inviamo a /login/Nome o /register/Nome in base al click
            const response = await fetch(`/${actionType}/${user}`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: pass 
            });

            if (response.redirected) {
                window.location.href = response.url;
            } else {
                const text = await response.text();
                alert(text); 
            }
        } catch (err) {
            console.error("Errore autenticazione:", err);
        }
    };
</script>
</body>
</html>
