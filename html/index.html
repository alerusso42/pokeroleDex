<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/html/style.css">
    <title>PokéDex API</title>
</head>
<body>

    <div class="image-wrapper">
        <img src="" id="img" alt="">
    </div>

    <div class="container">
        <h1>De pefforza</h1>
        <h3>Cerca un pokemon, abilità, natura, strumento, mossa di pokerole</h3>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Cosa stai cercando?">
            <button onclick="executeSearch()" class="search-button">Cerca</button>
        </div>

        <div id="test">
            </div>
    </div>

    <script>
        function executeSearch()
		{
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                // Invia la query direttamente (es: /Absol o /Pikachu)
                // Il tuo server gestirà la ricerca ricorsiva tra le cartelle
                window.location.href = `/search/${query}`;
            }
        }
		function executeTip()
		{
			const query = document.getElementById('searchInput').value.trim();
			console.log("query:" + query + "\n");
			fetch(`/keyPressed/search/${query}`)
			.then((output) => output.text())
			.then ((output) =>  
			{
				document.getElementById("test").innerHTML = output;
			}
			).catch((err) => 
			{
				document.getElementById("test").innerHTML = err;
			}
			)
		}

        document.getElementById('searchInput').addEventListener('keypress', function (e) 
		{
            if (e.key === 'Enter')
                executeSearch();
        }
        );
		document.getElementById('searchInput').addEventListener('input', executeTip);
    </script>

</body>
</html>
